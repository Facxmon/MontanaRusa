<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="utf-8" />
    <script>
      // Tema antes del primer pintado (fase 4.5, ver src/preferenciaDeTema.ts):
      // auto / claro / oscuro en localStorage; sin nada guardado, oscuro.
      try {
        var p = localStorage.getItem('montanarusa.tema');
        if (p === 'claro' || (p === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.tema = 'claro';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Montaña rusa — visualizador</title>
    <meta name="description" content="Visualizador 3D de los elementos de vía del modelo de montaña rusa en miniatura: riel, heartline, G y criterios de aceptación." />
    <meta property="og:title" content="Montaña rusa en miniatura — visualizador" />
    <meta property="og:description" content="Vía 3D, gráficos de G, jerk y curvatura, y parámetros editables que recalculan la vía en el navegador." />
    <meta property="og:image" content="https://facxmon.github.io/MontanaRusa/og.png" />
    <meta property="og:url" content="https://facxmon.github.io/MontanaRusa/visualizador.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <div id="visualizador"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Montaña rusa — visualizador</title>
    <meta name="description" content="Visualizador 3D de los elementos de vía del modelo de montaña rusa en miniatura: riel, heartline, G y criterios de aceptación." />
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <div id="app">
      <div id="errores"></div>
      <main id="principal">
        <nav id="selectorDeVista" class="pestanas" role="tablist" aria-label="Vista"></nav>
        <div id="vista3d" aria-label="Vista 3D de la vía"></div>
        <div id="reproductor" class="reproductor" aria-label="Reproducción" hidden></div>
        <div id="graficos" aria-label="Gráficos" hidden></div>
      </main>
      <aside id="panel" aria-label="Datos del layout">
        <header id="cabecera">
          <h1>Montaña rusa en miniatura</h1>
          <p class="subtitulo">Vía generada en MATLAB, leída del contrato JSON v1</p>
        </header>
        <section id="selectorDeCaso"></section>
        <nav id="selectorDePanel" class="pestanas pestanas-panel" role="tablist" aria-label="Panel"></nav>
        <div id="panelResultados">
          <section id="selectorDeMagnitud"></section>
          <section id="leyenda"></section>
          <section id="resumenLayout"></section>
          <section id="elementos"></section>
          <section id="resumenElemento"></section>
          <section id="criterios"></section>
        </div>
        <div id="panelDiseno" hidden>
          <section id="diseno"></section>
          <section id="parametros"></section>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
